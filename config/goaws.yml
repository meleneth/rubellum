Local:
  Host: 127.0.0.1
  Port: 4100
  # GoAWS prefixes a nonempty Region to Host in returned queue URLs.
  # Keep it empty for loopback; the SDK separately uses us-east-1 for signing.
  Region: ""
  AccountId: "100010001000"
  LogToFile: false
  QueueAttributeDefaults:
    VisibilityTimeout: 30
    MaximumMessageSize: 262144
    ReceiveMessageWaitTimeSeconds: 0
