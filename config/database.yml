default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("PGHOST", "/run/postgresql") %>
  username: <%= ENV.fetch("PGUSER", "rubellum") %>
  database: <%= ENV.fetch("PGDATABASE", "rubellum") %>

development:
  <<: *default
test:
  <<: *default
production:
  <<: *default
